version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: audio
build:
  toolchains: []
  run_buildscript: false
images:
  - id: audio
    target: service
    service: audio
    source: ghcr.io/0xshug0/audio.cpp
    channel: custom
    sort: created
    tag_regex: '^full-vulkan-[0-9]{8}-[0-9a-f]{7,40}$'
    version_regex: '^full-vulkan-(?P<version>[0-9]{4})(?P<month>[0-9]{2})(?P<day>[0-9]{2})-(?P<commit>[0-9a-f]{7,40})$'
    version_template: '{version}.{month}.{day}+{commit}'
    delivery:
      mode: mirror
      require_digest_match: true
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: false
    name: audio.cpp
